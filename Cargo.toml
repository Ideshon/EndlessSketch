[package]
name = "endless-sketch"
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
description = "A durable, effectively unbounded deep-zoom drawing canvas"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
crossbeam-channel = "0.5.15"
eframe = { version = "0.34.3", features = ["persistence", "wgpu"] }
egui = "0.34.3"
env_logger = "0.11.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.33"
lyon = "1.0.19"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
rayon = "1.12.0"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
